<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIVIVIDE — знакомства</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  :root {
    --accent: #a0a0b8;
    --accent-light: #e8e8f0;
    --accent-dark: #6b6b85;
    --accent-glow: rgba(170,170,200,0.45);
    --bg-1: #14141a;
    --bg-2: #1c1c24;
    --bg-3: #101014;
    --bg-radial-1: rgba(120,120,140,0.25);
    --bg-radial-2: rgba(90,90,110,0.28);
    --bg-radial-3: rgba(140,140,160,0.15);
    --float-1: rgba(180,180,200,0.10);
    --float-2: rgba(150,150,175,0.12);
  }

  body {
    min-height: 100vh;
    background: var(--bg-3);
    background-image:
      radial-gradient(circle at 15% 20%, var(--bg-radial-1), transparent 45%),
      radial-gradient(circle at 85% 80%, var(--bg-radial-2), transparent 50%),
      radial-gradient(circle at 50% 50%, var(--bg-radial-3), transparent 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: bgShift 18s ease-in-out infinite;
    color: #e8e8f0;
    overflow-x: hidden;
    padding-bottom: 60px;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0; }
    50%  { background-position: 100% 50%, 0% 50%, 20% 80%, 0 0; }
    100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0; }
  }
  body::before {
    content: '';
    position: fixed;
    top: -20%; left: -20%;
    width: 140%; height: 140%;
    background:
      radial-gradient(circle at 30% 30%, var(--float-1), transparent 40%),
      radial-gradient(circle at 70% 70%, var(--float-2), transparent 45%);
    animation: floatGlow 22s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes floatGlow {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(6%,-4%) scale(1.08); }
    100% { transform: translate(-5%,5%) scale(1.03); }
  }

  /* === ФОН: ПАУТИНА НА ВСЮ СТРАНИЦУ === */
  body.fx-web {
    background: #050508;
    background-image:
      repeating-linear-gradient(60deg, rgba(200,200,220,0.035) 0px, rgba(200,200,220,0.035) 1px, transparent 1px, transparent 60px),
      repeating-linear-gradient(-60deg, rgba(200,200,220,0.035) 0px, rgba(200,200,220,0.035) 1px, transparent 1px, transparent 60px),
      radial-gradient(circle at 20% 15%, rgba(120,120,140,0.08), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(90,90,110,0.10), transparent 45%);
    animation: none;
  }
  body.fx-web::before {
    background-image:
      repeating-linear-gradient(0deg, rgba(200,200,220,0.02) 0px, rgba(200,200,220,0.02) 1px, transparent 1px, transparent 90px),
      repeating-linear-gradient(90deg, rgba(200,200,220,0.02) 0px, rgba(200,200,220,0.02) 1px, transparent 1px, transparent 90px);
    animation: none;
  }
  .web-corner {
    position: fixed; width: 340px; height: 340px;
    pointer-events: none; z-index: 1;
    opacity: 0; transition: opacity 0.6s ease;
    background-size: contain; background-repeat: no-repeat;
  }
  body.fx-web .web-corner { opacity: 0.45; }
  .web-corner.tl { top: 0; left: 0; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='white' stroke-width='0.7'><path d='M0 0 L200 0 M0 0 L0 200 M0 0 L141 141 M0 0 L100 173 M0 0 L173 100 M0 0 L60 190 M0 0 L190 60'/><path d='M20 0 Q14 14 0 20 M50 0 Q35 35 0 50 M90 0 Q63 63 0 90 M140 0 Q99 99 0 140 M190 0 Q134 134 0 190'/></g></svg>"); }
  .web-corner.tr { top: 0; right: 0; transform: scaleX(-1); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='white' stroke-width='0.7'><path d='M0 0 L200 0 M0 0 L0 200 M0 0 L141 141 M0 0 L100 173 M0 0 L173 100 M0 0 L60 190 M0 0 L190 60'/><path d='M20 0 Q14 14 0 20 M50 0 Q35 35 0 50 M90 0 Q63 63 0 90 M140 0 Q99 99 0 140 M190 0 Q134 134 0 190'/></g></svg>"); }
  .web-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='white' stroke-width='0.7'><path d='M0 0 L200 0 M0 0 L0 200 M0 0 L141 141 M0 0 L100 173 M0 0 L173 100 M0 0 L60 190 M0 0 L190 60'/><path d='M20 0 Q14 14 0 20 M50 0 Q35 35 0 50 M90 0 Q63 63 0 90 M140 0 Q99 99 0 140 M190 0 Q134 134 0 190'/></g></svg>"); }
  .web-corner.br { bottom: 0; right: 0; transform: scale(-1,-1); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='white' stroke-width='0.7'><path d='M0 0 L200 0 M0 0 L0 200 M0 0 L141 141 M0 0 L100 173 M0 0 L173 100 M0 0 L60 190 M0 0 L190 60'/><path d='M20 0 Q14 14 0 20 M50 0 Q35 35 0 50 M90 0 Q63 63 0 90 M140 0 Q99 99 0 140 M190 0 Q134 134 0 190'/></g></svg>"); }

  /* === СТЕКЛО === */
  body.fx-glass {
    background: #0a0a10;
  }
  body.fx-glass .topbar,
  body.fx-glass .profile-card,
  body.fx-glass .modal-content,
  body.fx-glass .liker-row,
  body.fx-glass .stat-box,
  body.fx-glass .profile-hero,
  body.fx-glass .admin-user-row {
    background: rgba(255,255,255,0.06) !important;
    backdrop-filter: blur(22px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(22px) saturate(180%) !important;
    border: 1px solid rgba(255,255,255,0.14) !important;
  }
  body.fx-glass .profile-card:hover {
    background: rgba(255,255,255,0.10) !important;
    box-shadow: 0 18px 50px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.1) !important;
  }
  body.fx-glass .contact-badge,
  body.fx-glass .like-btn,
  body.fx-glass .login-btn,
  body.fx-glass .logout-btn,
  body.fx-glass .theme-btn,
  body.fx-glass .vide-badge {
    background: rgba(255,255,255,0.08) !important;
    border-color: rgba(255,255,255,0.18) !important;
  }

  /* === СНЕГ === */
  .snow-layer {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
    display: none;
  }
  body.fx-snow .snow-layer { display: block; }
  .snowflake {
    position: absolute; top: -10px;
    color: #fff; font-size: 14px;
    opacity: 0.7;
    animation: fall linear infinite;
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(40px) rotate(360deg); }
  }

  /* === ЗВЁЗДЫ === */
  .stars-layer {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    display: none;
  }
  body.fx-stars .stars-layer { display: block; }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }

  /* === МЕРЦАНИЕ / NEON === */
  body.fx-neon .profile-card.mine,
  body.fx-neon .profile-card.premium {
    animation: neonPulse 2s ease-in-out infinite;
  }
  @keyframes neonPulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.25); }
  }

  .topbar {
    position: relative; z-index: 5; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, rgba(60,60,72,0.5), rgba(30,30,38,0.1));
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(14px); flex-wrap: wrap;
  }
  .brand-wrap { display: flex; align-items: center; gap: 10px; }
  .brand {
    font-size: 24px; letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent-light), var(--accent), var(--accent-light));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite; font-weight: 700;
  }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .brand-gif {
    width: 34px; height: 34px;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 0 12px var(--accent-glow);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .topbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .theme-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(60,60,78,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8f0; font-size: 18px; cursor: pointer;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-btn:hover {
    background: rgba(150,150,180,0.5);
    box-shadow: 0 0 18px var(--accent-glow);
    transform: rotate(15deg);
  }

  .user-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px;
    background: rgba(60,60,78,0.55);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px; cursor: pointer; transition: all 0.25s;
  }
  .user-chip:hover { background: rgba(90,90,115,0.65); box-shadow: 0 0 18px var(--accent-glow); }
  .user-chip img, .user-chip .avatar-placeholder {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    background: linear-gradient(135deg, #2a2a34, #3a3a48);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #b0b0c4; flex-shrink: 0;
  }
  .user-chip span { font-size: 13.5px; color: #e8e8f5; }
  .user-chip.premium { border-color: rgba(255,215,0,0.5); box-shadow: 0 0 14px rgba(255,215,0,0.35); }

  .login-btn, .logout-btn {
    padding: 9px 18px; font-size: 13px; letter-spacing: 0.5px;
    color: #e8e8f0; background: rgba(60,60,78,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px; cursor: pointer; transition: all 0.25s; font-family: inherit;
  }
  .login-btn:hover, .logout-btn:hover { background: rgba(150,150,180,0.55); box-shadow: 0 0 18px var(--accent-glow); }
  .logout-btn { color: #ff9aa7; }
  .logout-btn:hover { background: rgba(255,80,100,0.18); border-color: rgba(255,90,110,0.4); box-shadow: none; }

  .vide-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; font-size: 13px;
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,180,0,0.15));
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 20px; color: #ffd970; font-weight: 600;
    cursor: pointer; transition: all 0.25s; font-family: inherit;
  }
  .vide-badge:hover {
    background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,180,0,0.25));
    box-shadow: 0 0 18px rgba(255,215,0,0.4);
  }

  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  .add-btn {
    display: block; margin: 0 auto 30px; padding: 14px 32px;
    font-size: 15px; letter-spacing: 1px; color: #e8e8f0;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 55%, transparent),
      color-mix(in srgb, var(--accent-dark) 55%, transparent));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px; cursor: pointer; backdrop-filter: blur(12px);
    transition: all 0.3s; font-family: inherit;
  }
  .add-btn:hover { box-shadow: 0 0 28px var(--accent-glow); transform: translateY(-2px); }

  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }

  .profile-card {
    position: relative; border-radius: 18px; overflow: hidden;
    background: rgba(38,38,46,0.55); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.4s;
    animation: cardIn 0.4s ease;
    display: flex; flex-direction: column;
  }
  .profile-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.65), 0 0 22px var(--accent-glow);
  }
  .profile-card.mine {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 22px var(--accent-glow);
  }
  .profile-card.premium { box-shadow: 0 0 24px rgba(255,215,0,0.35), 0 12px 30px rgba(0,0,0,0.5); }
  .profile-card.premium::before {
    content: '★'; position: absolute; top: 10px; right: 10px;
    z-index: 3; font-size: 18px; color: #ffd970;
    text-shadow: 0 0 12px rgba(255,215,0,0.9);
  }
  .profile-card.rgb { animation: rgbGlow 4s linear infinite; }
  @keyframes rgbGlow {
    0%   { box-shadow: 0 0 25px rgba(255,0,80,0.6),  0 12px 30px rgba(0,0,0,0.5); }
    25%  { box-shadow: 0 0 25px rgba(255,180,0,0.6), 0 12px 30px rgba(0,0,0,0.5); }
    50%  { box-shadow: 0 0 25px rgba(0,220,80,0.6),  0 12px 30px rgba(0,0,0,0.5); }
    75%  { box-shadow: 0 0 25px rgba(0,140,255,0.6), 0 12px 30px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 0 25px rgba(255,0,80,0.6),  0 12px 30px rgba(0,0,0,0.5); }
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .mine-badge {
    position: absolute; top: 10px; left: 10px;
    padding: 5px 12px; font-size: 11px; letter-spacing: 1px;
    background: rgba(20,20,26,0.8);
    border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 14px; color: #d8d8e4;
    text-transform: uppercase; z-index: 2; backdrop-filter: blur(8px);
  }
  .pin-badge {
    position: absolute; top: 10px; right: 10px;
    padding: 5px 10px; font-size: 12px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.5);
    border-radius: 14px; color: #ffd970;
    z-index: 2;
  }
  .profile-card.premium .pin-badge { right: 44px; }

  .profile-photo { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: #1a1a22; }
  .profile-photo-placeholder {
    width: 100%; aspect-ratio: 4/5;
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: rgba(200,200,220,0.3);
    background: linear-gradient(135deg, #22222c, #2e2e3a);
  }

  .profile-info { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .profile-info h3 { font-size: 18px; font-weight: 600; color: #f0f0f8; letter-spacing: 0.3px; }
  .profile-info h3 .age { font-weight: 300; opacity: 0.7; font-size: 15px; }
  .profile-info p { font-size: 13.5px; color: #b8b8cc; margin-top: 8px; line-height: 1.45; word-break: break-word; }
  .profile-date { display: block; margin-top: 10px; font-size: 11px; color: #7a7a8c; letter-spacing: 0.5px; }

  .contact-badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 7px 12px; font-size: 12.5px;
    color: #e8e8f5;
    background: color-mix(in srgb, var(--accent) 25%, transparent);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; text-decoration: none; word-break: break-all;
    transition: all 0.25s; align-self: flex-start; max-width: 100%;
  }
  .contact-badge:hover {
    background: color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow: 0 0 18px var(--accent-glow);
  }

  .like-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .like-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; font-size: 13px; color: #d8d8e4;
    background: rgba(60,60,78,0.55);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px; cursor: pointer; transition: all 0.25s; font-family: inherit;
  }
  .like-btn:hover { background: rgba(255,90,110,0.15); border-color: rgba(255,90,110,0.4); color: #ff8a99; }
  .like-btn .heart { font-size: 15px; transition: transform 0.25s; display: inline-block; }
  .like-btn.liked { background: rgba(255,90,110,0.2); border-color: rgba(255,90,110,0.55); color: #ff8a99; }
  .like-btn.liked .heart { transform: scale(1.2); filter: drop-shadow(0 0 6px rgba(255,90,110,0.7)); }
  .like-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(10,10,14,0.75); backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center;
    z-index: 100; padding: 20px; animation: fadeIn 0.25s ease;
  }
  .modal.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    position: relative; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto;
    padding: 28px 24px; border-radius: 22px;
    background: rgba(38,38,46,0.9);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 25px 70px rgba(0,0,0,0.7);
    animation: modalIn 0.3s ease;
  }
  .modal-content.wide { max-width: 600px; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-content h2 {
    font-size: 20px; letter-spacing: 2px; margin-bottom: 20px;
    color: #e8e8f5; text-align: center; text-transform: uppercase; font-weight: 500;
  }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #c8c8d6; font-size: 16px; cursor: pointer;
    transition: all 0.25s; z-index: 2;
  }
  .modal-close:hover { background: rgba(255,255,255,0.14); color: #fff; }

  form label { display: block; font-size: 13px; color: #b0b0c4; margin-bottom: 14px; letter-spacing: 0.5px; }
  form input, form textarea, form select {
    width: 100%; margin-top: 6px; padding: 11px 14px;
    font-size: 14px; color: #f0f0f8;
    background: rgba(20,20,26,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; outline: none; transition: all 0.25s;
    resize: vertical; font-family: inherit;
  }
  form input:focus, form textarea:focus, form select:focus {
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  form input[type="file"] { padding: 8px; font-size: 12.5px; color: #b0b0c4; }
  form input[type="file"]::file-selector-button {
    background: rgba(110,110,135,0.5); color: #e8e8f0;
    border: none; padding: 8px 14px; border-radius: 8px;
    margin-right: 10px; cursor: pointer; font-family: inherit;
  }

  .contact-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }

  .submit-btn {
    width: 100%; padding: 14px; margin-top: 8px;
    font-size: 15px; letter-spacing: 1px; color: #f0f0f8;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 70%, transparent),
      color-mix(in srgb, var(--accent-dark) 70%, transparent));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; cursor: pointer; transition: all 0.3s; font-family: inherit;
  }
  .submit-btn:hover { box-shadow: 0 0 24px var(--accent-glow); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-status { margin-top: 12px; text-align: center; font-size: 13px; min-height: 18px; color: #a8a8c0; }
  .form-status.error { color: #ff7a88; }
  .form-status.success { color: #9fe0b0; }

  .profile-hero {
    display: flex; gap: 18px; align-items: center;
    padding: 16px; background: rgba(30,30,40,0.6);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; margin-bottom: 22px;
  }
  .profile-hero img, .profile-hero .big-avatar {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    background: linear-gradient(135deg, #2a2a34, #3a3a48);
    display: flex; align-items: center; justify-content: center;

  function hexToRgba(hex, alpha) {
    if (!hex) return 'rgba(0,0,0,0)';
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function lighten(hex, amount = 0.4) {
    const h = hex.replace('#', '');
    const r = Math.min(255, Math.round(parseInt(h.substring(0, 2), 16) + 255 * amount));
    const g = Math.min(255, Math.round(parseInt(h.substring(2, 4), 16) + 255 * amount));
    const b = Math.min(255, Math.round(parseInt(h.substring(4, 6), 16) + 255 * amount));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  function darken(hex, amount = 0.3) {
    const h = hex.replace('#', '');
    const r = Math.max(0, Math.round(parseInt(h.substring(0, 2), 16) * (1 - amount)));
    const g = Math.max(0, Math.round(parseInt(h.substring(2, 4), 16) * (1 - amount)));
    const b = Math.max(0, Math.round(parseInt(h.substring(4, 6), 16) * (1 - amount)));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function applyTheme(themeKey) {
    let theme;
    if (THEMES[themeKey]) theme = THEMES[themeKey];
    else if (themeKey.startsWith('custom:')) {
      const accent = themeKey.slice(7);
      theme = {
        name: 'Своя', accent,
        accentLight: lighten(accent, 0.45),
        accentDark: darken(accent, 0.35),
        bg1: darken(accent, 0.9),
        bg2: darken(accent, 0.86),
        bg3: darken(accent, 0.94),
        r1: hexToRgba(accent, 0.22),
        r2: hexToRgba(accent, 0.24),
        r3: hexToRgba(accent, 0.14),
        f1: hexToRgba(accent, 0.10),
        f2: hexToRgba(accent, 0.12)
      };
    } else theme = THEMES.gray;

    const root = document.documentElement;
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--accent-light', theme.accentLight);
    root.style.setProperty('--accent-dark', theme.accentDark);
    root.style.setProperty('--accent-glow', hexToRgba(theme.accent, 0.45));
    root.style.setProperty('--bg-1', theme.bg1);
    root.style.setProperty('--bg-2', theme.bg2);
    root.style.setProperty('--bg-3', theme.bg3);
    root.style.setProperty('--bg-radial-1', theme.r1);
    root.style.setProperty('--bg-radial-2', theme.r2);
    root.style.setProperty('--bg-radial-3', theme.r3);
    root.style.setProperty('--float-1', theme.f1);
    root.style.setProperty('--float-2', theme.f2);

    if (theme.special === 'web') setFx('web', true);

    localStorage.setItem(THEME_KEY, themeKey);
    document.querySelectorAll('.theme-swatch').forEach(s => {
      s.classList.toggle('active', s.dataset.key === themeKey);
    });
  }

  function renderThemeGrid() {
    themeGrid.innerHTML = '';
    Object.entries(THEMES).forEach(([key, t]) => {
      const el = document.createElement('div');
      el.className = 'theme-swatch';

      const dotStyle = key === 'web'
        ? `background: #050508; border: 1px solid rgba(255,255,255,0.3);`
        : `background: linear-gradient(135deg, ${t.accentLight}, ${t.accent}, ${t.accentDark})`;
      const dotContent = key === 'web' ? '🕷' : '';
      el.innerHTML = `
        <div class="dot" style="${dotStyle}">${dotContent}</div>
        <div class="name">${t.name}</div>
      `;
      el.addEventListener('click', () => applyTheme(key));
      themeGrid.appendChild(el);
    });
    const saved = localStorage.getItem(THEME_KEY) || 'gray';
    document.querySelectorAll('.theme-swatch').forEach(s => {
      s.classList.toggle('active', s.dataset.key === saved);

  function applyFx(fx) {
    document.body.classList.toggle('fx-web', !!fx.web);
    document.body.classList.toggle('fx-glass', !!fx.glass);
    document.body.classList.toggle('fx-snow', !!fx.snow);
    document.body.classList.toggle('fx-stars', !!fx.stars);
    document.body.classList.toggle('fx-neon', !!fx.neon);

    const switches = {
      fxWeb: !!fx.web,
      fxGlass: !!fx.glass,
      fxSnow: !!fx.snow,
      fxStars: !!fx.stars,
      fxNeon: !!fx.neon
    };
    Object.entries(switches).forEach(([id, on]) => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('on', on);
    });

    if (fx.snow) spawnSnow(); else snowLayer.innerHTML = '';
    if (fx.stars) spawnStars(); else starsLayer.innerHTML = '';
  }

  async function loadWall() {
    try {

  function renderWall(profiles, myId) {
    wallEl.innerHTML = '';
    if (!profiles.length) return;
    profiles.forEach(p => wallEl.appendChild(createCard(p, myId)));
  }

  function createCard(p, myId) {
    const card = document.createElement('div');
    let cls = 'profile-card';
    if (String(p.id) === String(myId)) cls += ' mine';
    if (p.is_premium) cls += ' premium';
    if (p.is_premium && p.card_rgb) cls += ' rgb';
    card.className = cls;
    card.dataset.id = p.id;

    // премиум-оформление: цвет рамки и/или фон карточки
    if (p.is_premium) {
      if (p.card_color && !p.card_rgb) {
        card.style.borderColor = p.card_color;
        card.style.boxShadow = `0 12px 30px rgba(0,0,0,0.5), 0 0 22px ${hexToRgba(p.card_color, 0.55)}`;
      }
      if (p.card_bg) {
        card.style.background = p.card_bg;
        card.style.backdropFilter = 'blur(16px)';
      }
    }

    const photoHTML = p.photo
      ? `<img class="profile-photo" src="${p.photo}" alt="" loading="lazy">`
      : `<div class="profile-photo-placeholder">✦</div>`;
    const date = new Date(p.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: 'long' });

    let contactHTML = '';
    if (p.contact_value) {
      const link = buildContactLink(p.contact_type, p.contact_value);
      const label = contactLabel(p.contact_type);
      const icon = contactIcon(p.contact_type);
      const display = p.contact_type === 'telegram'
        ? (p.contact_value.startsWith('@') ? p.contact_value : '@' + p.contact_value)
        : p.contact_value;
      contactHTML = link
        ? `<a class="contact-badge" href="${link}" target="_blank" rel="noopener">${icon} ${label}: ${escapeHtml(display)}</a>`
        : `<span class="contact-badge">${icon} ${label}: ${escapeHtml(display)}</span>`;
    }

    const liked = myLikes.has(String(p.id));
    const likeCount = p.likes || 0;
    const isMine = String(p.id) === String(myId);

    card.innerHTML = `
      ${isMine ? '<div class="mine-badge">★ Это ты</div>' : ''}
      ${p.card_pinned ? '<div class="pin-badge">📌</div>' : ''}
      ${photoHTML}
      <div class="profile-info">
        <h3>${escapeHtml(p.name)} <span class="age">${p.age}</span></h3>
        ${p.bio ? `<p>${escapeHtml(p.bio)}</p>` : ''}
        ${contactHTML}
        <div class="like-row">
          <button class="like-btn ${liked ? 'liked' : ''}" ${isMine ? 'disabled title="Нельзя лайкнуть себя"' : ''}>
            <span class="heart">${liked ? '❤️' : '🤍'}</span>
            <span class="like-count">${likeCount}</span>
          </button>
        </div>
        <span class="profile-date">с ${date}</span>
      </div>
    `;
    if (!isMine) {
      card.querySelector('.like-btn').addEventListener('click', () => toggleLike(p.id));
    }
    return card;
  }

  async function toggleLike(targetId) {
    const myId = getMyId();
    if (!myId) { alert('Сначала создай свою анкету!'); return; }
    try {
      const result = await api('/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ likerId: parseInt(myId), targetId: parseInt(targetId) })
      });
      if (result.liked) myLikes.add(String(targetId));
      else myLikes.delete(String(targetId));
      await loadWall();
    } catch (err) { alert(err.message); }
  }

  function buildContactLink(type, value) {
    const clean = String(value).trim().replace(/^@/, '');
    if (type === 'telegram') return 'https://t.me/' + encodeURIComponent(clean);
    if (type === 'discord') return 'https://discord.com/users/' + encodeURIComponent(clean);
    return null;
  }
  function contactLabel(type) { return type === 'telegram' ? 'Telegram' : 'Discord'; }
  function contactIcon(type) { return type === 'telegram' ? '✈️' : '🎮'; }

    const myId = getMyId();
    if (!myId) return;

    spinBtn.disabled = true;
    wheelResult.innerHTML = 'Крутим...';

    wheel.style.transform = `rotate(${angle}deg)`;
    try {
      const res = await api('/wheel/spin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: parseInt(myId) })
      });
      setTimeout(() => {
        currentBalance = res.balance;
        wheelResult.innerHTML = `

          <img src="${res.skin.photo}" alt="">
          <span class="rarity">${res.skin.rarity}</span>

        isSpinning = false;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(0deg)';

    if (!price) return;
    const p = parseInt(price);
    if (!p || p < 1) { alert('Некорректная цена'); return; }

      await api('/market/list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: parseInt(myId), skinId, price: p })
      });

            <img src="${l.skin ? l.skin.photo : ''}" alt="">
            <div class="lot-info">
              <strong>${escapeHtml(l.skin ? l.skin.name : '—')} <span style="opacity:0.6;font-size:11px;">${l.skin ? l.skin.rarity : ''}</span></strong>
              <small>Продавец: ${escapeHtml(l.seller_name)}</small>
            </div>
            <div class="lot-price">${l.price} 🪙</div>
            <div class="lot-actions">
              ${String(l.seller_id) === String(myId)
                ? `<button class="cancel" data-action="cancel" data-id="${l.id}">Снять</button>`
                : `<button class="buy" data-action="buy" data-id="${l.id}">Купить</button>`}
            </div>
          </div>
        `).join('');
      } else {
        const lots = await api('/market/my/' + myId);
        if (!lots.length) {
          marketContent.innerHTML = '<div class="empty-small">Ты ничего не продаёшь.</div>';
          return;
        }
        marketContent.innerHTML = lots.map(l => `
          <div class="market-lot">
            <img src="${l.skin ? l.skin.photo : ''}" alt="">
            <div class="lot-info">
              <strong>${escapeHtml(l.skin ? l.skin.name : '—')}</strong>
              <small>Ждёт покупателя</small>
            </div>
            <div class="lot-price">${l.price} 🪙</div>
            <div class="lot-actions">
              <button class="cancel" data-action="cancel" data-id="${l.id}">Снять</button>
            </div>
          </div>
        `).join('');
      }

      marketContent.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.id);
          const action = btn.dataset.action;
          try {
            if (action === 'buy') {
              if (!confirm('Купить этот скин?')) return;
              const res = await api('/market/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: parseInt(getMyId()), lotId: id })
              });
              alert('Куплено! Баланс: ' + res.balance + ' 🪙');
            } else if (action === 'cancel') {
              await api('/market/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: parseInt(getMyId()), lotId: id })
              });
            }
            await renderMarket();
            await renderTopbar();
          } catch (err) { alert(err.message); }
        });
      });
    } catch (err) { marketContent.innerHTML = `<div class="empty-small">${escapeHtml(err.message)}</div>`; }
  }

  closeMarket.addEventListener('click', () => marketModal.classList.remove('show'));
  marketModal.addEventListener('click', e => { if (e.target === marketModal) marketModal.classList.remove('show'); });

  // === ПРЕМИУМ-ОФОРМЛЕНИЕ ===
  function openAppearance(me) {
    if (!me.is_premium) {
      alert('Это доступно только для Premium. Попроси админа выдать.');
      return;
    }
    renderAppearanceForm(me);
    appearanceModal.classList.add('show');
  }

  function renderAppearanceForm(me) {
    appearanceContent.innerHTML = `
      <div class="premium-preview">
        <h4>Предпросмотр</h4>
        <div style="display:flex; gap:10px; align-items:center;">
          <div id="previewCard" style="
            width:60px;height:60px;border-radius:12px;
            background: ${me.card_bg || 'rgba(38,38,46,0.7)'};
            border:2px solid ${me.card_color || 'transparent'};
            box-shadow: ${me.card_color && !me.card_rgb ? `0 0 18px ${hexToRgba(me.card_color, 0.6)}` : 'none'};
            display:flex;align-items:center;justify-content:center;font-size:24px;
            ${me.card_rgb ? 'animation: rgbGlow 4s linear infinite;' : ''}
          ">${me.card_pinned ? '📌' : '✦'}</div>
          <div>
            <div style="color:#f0f0f8;font-weight:600;">${escapeHtml(me.name)}, ${me.age}</div>
            <div style="font-size:12px;color:#8a8a9c;">${me.card_rgb ? 'RGB-подсветка вкл' : 'RGB выкл'}</div>
          </div>
        </div>
      </div>

      <div class="color-row">
        <input type="color" id="cardColorInput" value="${me.card_color || '#a0a0b8'}">
        <label>Цвет рамки</label>
      </div>

      <div class="color-row">
        <input type="color" id="cardBgInput" value="${me.card_bg ? (me.card_bg.startsWith('#') ? me.card_bg : '#2a2a34') : '#2a2a34'}">
        <label>Цвет всей карточки</label>
      </div>

      <div class="fx-row">
        <div class="fx-label">Использовать цвет карточки</div>
        <div class="switch ${me.card_bg ? 'on' : ''}" id="useBgSwitch"></div>
      </div>

      <div class="fx-row">
        <div class="fx-label">RGB-подсветка</div>
        <div class="switch ${me.card_rgb ? 'on' : ''}" id="rgbSwitch"></div>
      </div>

      <div class="fx-row">
        <div class="fx-label">Закрепить анкету сверху</div>
        <div class="switch ${me.card_pinned ? 'on' : ''}" id="pinSwitch"></div>
      </div>

      <button class="submit-btn" id="saveAppearanceBtn" style="margin-top:18px;">Сохранить</button>
      <div class="form-status" id="appearanceStatus"></div>
    `;

    const colorInput = document.getElementById('cardColorInput');
    const bgInput = document.getElementById('cardBgInput');
    const useBgSwitch = document.getElementById('useBgSwitch');
    const rgbSwitch = document.getElementById('rgbSwitch');
    const pinSwitch = document.getElementById('pinSwitch');
    const previewCard = document.getElementById('previewCard');

    let state = {
      cardColor: me.card_color || '',
      cardBg: me.card_bg || '',
      cardRgb: !!me.card_rgb,
      cardPinned: !!me.card_pinned,
      useBg: !!me.card_bg
    };

    function updatePreview() {
      previewCard.style.borderColor = state.cardColor || 'transparent';
      previewCard.style.background = state.useBg ? state.cardBg : 'rgba(38,38,46,0.7)';
      previewCard.style.animation = state.cardRgb ? 'rgbGlow 4s linear infinite' : 'none';
      if (!state.cardRgb) {
        previewCard.style.boxShadow = state.cardColor ? `0 0 18px ${hexToRgba(state.cardColor, 0.6)}` : 'none';
      } else {
        previewCard.style.boxShadow = '';
      }
      previewCard.textContent = state.cardPinned ? '📌' : '✦';
    }

    colorInput.addEventListener('input', () => { state.cardColor = colorInput.value; updatePreview(); });
    bgInput.addEventListener('input', () => {
      state.cardBg = bgInput.value;
      if (state.useBg) updatePreview();
    });
    useBgSwitch.addEventListener('click', () => {
      state.useBg = !state.useBg;
      useBgSwitch.classList.toggle('on', state.useBg);
      updatePreview();
    });
    rgbSwitch.addEventListener('click', () => {
      state.cardRgb = !state.cardRgb;
      rgbSwitch.classList.toggle('on', state.cardRgb);
      updatePreview();
    });
    pinSwitch.addEventListener('click', () => {
      state.cardPinned = !state.cardPinned;
      pinSwitch.classList.toggle('on', state.cardPinned);
      updatePreview();
    });

    document.getElementById('saveAppearanceBtn').addEventListener('click', async () => {
      const st = document.getElementById('appearanceStatus');
      st.textContent = 'Сохраняем...';
      st.className = 'form-status';
      try {
        await api('/profiles/' + me.id + '/appearance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cardColor: state.cardColor,
            cardBg: state.useBg ? state.cardBg : '',
            cardRgb: state.cardRgb,
            cardPinned: state.cardPinned
          })
        });
        st.textContent = 'Сохранено!';
        st.className = 'form-status success';
        setTimeout(() => {
          appearanceModal.classList.remove('show');
          renderAll();
        }, 700);
      } catch (err) {
        st.textContent = err.message;
        st.className = 'form-status error';
      }
    });
  }

  closeAppearance.addEventListener('click', () => appearanceModal.classList.remove('show'));
  appearanceModal.addEventListener('click', e => { if (e.target === appearanceModal) appearanceModal.classList.remove('show'); });

  // === АДМИНКА ===
  function openAdmin() {
    adminModal.classList.add('show');
    if (adminPassword) {
      loadAdminUsers();
    } else {
      adminContent.innerHTML = `
        <label>Пароль админа
          <input type="password" id="adminPwInput" placeholder="Введи пароль">
        </label>
        <button class="submit-btn" id="adminLoginBtn">Войти</button>
        <div class="form-status" id="adminStatus"></div>
      `;
      document.getElementById('adminLoginBtn').onclick = async () => {
        const pw = document.getElementById('adminPwInput').value;
        adminPassword = pw;
        sessionStorage.setItem('xivivide_admin_pw', pw);
        await loadAdminUsers();
      };
    }
  }

  async function loadAdminUsers() {
    adminContent.innerHTML = '<div class="empty-small">Загрузка...</div>';
    try {
      const users = await api('/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
      });
      renderAdminUsers(users);
    } catch (err) {
      adminContent.innerHTML = `<div class="form-status error">${escapeHtml(err.message)}</div>`;
      adminPassword = '';
      sessionStorage.removeItem('xivivide_admin_pw');
    }
  }

  function renderAdminUsers(users) {
    if (!users.length) {
      adminContent.innerHTML = '<div class="empty-small">Нет пользователей</div>';
      return;
    }
    adminContent.innerHTML = users.map(u => {
      const av = u.photo ? `<img src="${u.photo}" alt="">` : `<div class="mini-avatar">✦</div>`;
      return `
        <div class="admin-user-row">
          ${av}
          <div class="admin-user-info">
            <strong>${escapeHtml(u.name)}, ${u.age} ${u.is_admin ? '👑' : ''} ${u.is_premium ? '⭐' : ''}</strong>
            <small>ID: ${u.id} · 🪙 ${u.vide} · ♥ ${u.likes}</small>
          </div>
          <div class="admin-actions">
            <input type="number" placeholder="+100" id="amt_${u.id}" value="100">
            <button class="give" data-action="give" data-id="${u.id}">Дать 🪙</button>
            <button class="premium" data-action="premium" data-id="${u.id}">${u.is_premium ? 'Снять ⭐' : 'Дать ⭐'}</button>
            <button class="danger" data-action="del" data-id="${u.id}">Удалить</button>
          </div>
        </div>
      `;
    }).join('');

    adminContent.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        try {
          if (action === 'give') {
            const amt = document.getElementById('amt_' + id).value;
            await api('/admin/give-vide', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: adminPassword, userId: parseInt(id), amount: parseInt(amt) })
            });
          } else if (action === 'premium') {
            await api('/admin/toggle-premium', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: adminPassword, userId: parseInt(id) })
            });
          } else if (action === 'del') {
            if (!confirm('Удалить анкету навсегда?')) return;
            await api('/admin/delete-user', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: adminPassword, userId: parseInt(id) })
            });
          }
          await loadAdminUsers();
          await renderAll();
        } catch (err) { alert(err.message); }
      });
    });
  }

  closeAdmin.addEventListener('click', () => adminModal.classList.remove('show'));
  adminModal.addEventListener('click', e => { if (e.target === adminModal) adminModal.classList.remove('show'); });

  // === ШАПКА ===
  async function renderTopbar() {
    const myId = getMyId();
    topbarRight.innerHTML = '';

    const themeBtn = document.createElement('button');
    themeBtn.className = 'theme-btn';
    themeBtn.title = 'Тема и эффекты';
    themeBtn.textContent = '🎨';
    themeBtn.addEventListener('click', () => themeModal.classList.add('show'));
    topbarRight.appendChild(themeBtn);

    if (myId) {
      try {
        const { vide } = await api('/vide/' + myId);
        currentBalance = vide;
        const videBtn = document.createElement('button');
        videBtn.className = 'vide-badge';
        videBtn.title = 'Колесо фортуны';
        videBtn.innerHTML = `🪙 ${vide}`;
        videBtn.addEventListener('click', openWheel);
        topbarRight.appendChild(videBtn);

        const invBtn = document.createElement('button');
        invBtn.className = 'theme-btn';
        invBtn.title = 'Инвентарь';
        invBtn.textContent = '🎒';
        invBtn.addEventListener('click', openInventory);
        topbarRight.appendChild(invBtn);

        const marketBtn = document.createElement('button');
        marketBtn.className = 'theme-btn';
        marketBtn.title = 'Рынок';
        marketBtn.textContent = '🏪';
        marketBtn.addEventListener('click', openMarket);
        topbarRight.appendChild(marketBtn);
      } catch {}
    }

    const adminBtn = document.createElement('button');
    adminBtn.className = 'theme-btn';
    adminBtn.title = 'Админ-панель';
    adminBtn.textContent = '👑';
    adminBtn.addEventListener('click', openAdmin);
    topbarRight.appendChild(adminBtn);

    if (!myId) {
      const loginBtn = document.createElement('button');
      loginBtn.className = 'login-btn';
      loginBtn.textContent = 'Войти';
      loginBtn.addEventListener('click', openLoginPicker);
      topbarRight.appendChild(loginBtn);
      openBtn.style.display = 'block';
      return;
    }
    try {
      const profiles = await api('/profiles');
      const me = profiles.find(p => String(p.id) === String(myId));
      if (!me) { setMyId(null); renderTopbar(); return; }
      const chip = document.createElement('div');
      chip.className = 'user-chip' + (me.is_premium ? ' premium' : '');
      chip.innerHTML = (me.photo
        ? `<img src="${me.photo}" alt="">`
        : `<div class="avatar-placeholder">✦</div>`) + `<span>${escapeHtml(me.name)}${me.is_premium ? ' ⭐' : ''}</span>`;
      chip.addEventListener('click', openMyProfile);
      const logoutBtn = document.createElement('button');
      logoutBtn.className = 'logout-btn';
      logoutBtn.textContent = 'Выйти';
      logoutBtn.addEventListener('click', () => {
        if (!confirm('Выйти из профиля?')) return;
        setMyId(null);
        renderAll();
      });
      topbarRight.appendChild(chip);
      topbarRight.appendChild(logoutBtn);
      openBtn.style.display = 'none';
    } catch (err) { console.error(err); }
  }

  async function openLoginPicker() {
    const name = prompt('Введи имя своей анкеты:');
    if (!name) return;
    try {
      const profile = await api('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      setMyId(profile.id);
      renderAll();
    } catch (err) { alert(err.message); }
  }

  async function openMyProfile() {
    const myId = getMyId();
    if (!myId) return;
    try {
      const profiles = await api('/profiles');
      const me = profiles.find(p => String(p.id) === String(myId));
      if (!me) return;
      const likedBy = await api('/liked-by/' + myId);
      renderMyProfile(me, likedBy);
      myProfileModal.classList.add('show');
    } catch (err) { console.error(err); }
  }

  function renderMyProfile(me, likedBy) {
    const avatarHTML = me.photo ? `<img src="${me.photo}" alt="">` : `<div class="big-avatar">✦</div>`;
    const contactLink = me.contact_value ? buildContactLink(me.contact_type, me.contact_value) : null;
    myProfileContent.innerHTML = `
      <div class="profile-hero">
        ${avatarHTML}
        <div class="profile-hero-info">
          <h3>${escapeHtml(me.name)} <span class="age">${me.age}</span> ${me.is_premium ? '⭐' : ''}</h3>
          ${me.bio ? `<p>${escapeHtml(me.bio)}</p>` : ''}
          ${me.contact_value ? `<a class="contact-badge" ${contactLink ? `href="${contactLink}" target="_blank" rel="noopener"` : ''}>
            ${contactIcon(me.contact_type)} ${contactLabel(me.contact_type)}: ${escapeHtml(me.contact_value)}
          </a>` : ''}
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${me.likes || 0}</div><div class="label">Всего ♥</div></div>
        <div class="stat-box"><div class="num">${me.vide || 0}</div><div class="label">Вайдики</div></div>
        <div class="stat-box"><div class="num">${likedBy.length}</div><div class="label">Кто лайкнул</div></div>
      </div>
      <div class="section-title">Кто тебя лайкнул</div>
      ${likedBy.length === 0
        ? '<div class="empty-small">Пока никто не лайкнул. Загляни позже!</div>'
        : likedBy.map(p => {
            const link = p.contact_value ? buildContactLink(p.contact_type, p.contact_value) : null;
            const av = p.photo ? `<img src="${p.photo}" alt="">` : `<div class="mini-avatar">✦</div>`;
            const c = p.contact_value
              ? (link
                  ? `<a class="liker-contact" href="${link}" target="_blank" rel="noopener">${contactIcon(p.contact_type)} ${escapeHtml(p.contact_value)}</a>`
                  : `<span class="liker-contact">${contactIcon(p.contact_type)} ${escapeHtml(p.contact_value)}</span>`)
              : '';
            return `<div class="liker-row">${av}
              <div class="liker-info">
                <strong>${escapeHtml(p.name)}, ${p.age}</strong>
                <small>${escapeHtml((p.bio || '').slice(0,40))}${p.bio && p.bio.length > 40 ? '…' : ''}</small>
              </div>${c}</div>`;
          }).join('')
      }
      <div class="modal-actions">
        <button id="editMyBtn">Редактировать</button>
        ${me.is_premium ? '<button class="premium" id="appearanceBtn">⭐ Оформление</button>' : ''}
        <button id="deleteMyBtn" class="danger">Удалить анкету</button>
      </div>
    `;
    document.getElementById('editMyBtn').onclick = () => {
      myProfileModal.classList.remove('show');
      openEditForm(me);
    };
    const appBtn = document.getElementById('appearanceBtn');
    if (appBtn) appBtn.onclick = () => {
      myProfileModal.classList.remove('show');
      openAppearance(me);
    };
    document.getElementById('deleteMyBtn').onclick = async () => {
      if (!confirm('Точно удалить свою анкету?')) return;
      try {
        await api('/profiles/' + me.id, { method: 'DELETE' });
        setMyId(null);
        myProfileModal.classList.remove('show');
        renderAll();
      } catch (err) { alert(err.message); }
    };
  }

  let editingId = null;

  function openEditForm(profile) {
    editingId = profile.id;
    form.reset();
    form.name.value = profile.name;
    form.age.value = profile.age;
    form.bio.value = profile.bio || '';
    form.contactType.value = profile.contact_type || 'telegram';
    form.contactValue.value = profile.contact_value || '';
    document.querySelector('#modal h2').textContent = 'Редактировать анкету';
    form.querySelector('.submit-btn').textContent = 'Сохранить изменения';
    modal.classList.add('show');
  }
  function openCreateForm() {
    editingId = null;
    form.reset();
    document.querySelector('#modal h2').textContent = 'Твоя анкета';
    form.querySelector('.submit-btn').textContent = 'Опубликовать';
    modal.classList.add('show');
  }

  openBtn.addEventListener('click', openCreateForm);
  closeBtn.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
  closeMyProfile.addEventListener('click', () => myProfileModal.classList.remove('show'));
  myProfileModal.addEventListener('click', e => { if (e.target === myProfileModal) myProfileModal.classList.remove('show'); });
  closeTheme.addEventListener('click', () => themeModal.classList.remove('show'));
  themeModal.addEventListener('click', e => { if (e.target === themeModal) themeModal.classList.remove('show'); });
  applyCustom.addEventListener('click', () => { applyTheme('custom:' + customColor.value); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const submitBtn = form.querySelector('.submit-btn');
    submitBtn.disabled = true;
    statusEl.textContent = 'Сохраняем...';
    statusEl.className = 'form-status';
    try {
      const fd = new FormData(form);
      if (!fd.get('name') || !fd.get('age')) throw new Error('Имя и возраст обязательны');
      let saved;
      if (editingId) {
        saved = await api('/profiles/' + editingId, { method: 'PUT', body: fd });
      } else {
        saved = await api('/profiles', { method: 'POST', body: fd });
        setMyId(saved.id);
      }
      statusEl.textContent = 'Готово!';
      form.reset();
      setTimeout(() => { modal.classList.remove('show'); renderAll(); }, 600);
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'form-status error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }

  async function renderAll() {
    await renderTopbar();
    await loadWall();
  }

  renderThemeGrid();
  applyTheme(localStorage.getItem(THEME_KEY) || 'gray');
  applyFx(getFx());
  renderAll();
</script>
</body>
</html>
